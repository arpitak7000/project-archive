<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Maitri Gift Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/navbar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cart.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo"><a href="{{ url_for('index') }}" style="color:white;text-decoration:none;">Maitri Gift Shop</a></div>
            <ul class="nav-links">
                <li><a href="{{ url_for('index') }}">Home</a></li>
                <li><a href="{{ url_for('products') }}">Products</a></li>
                <li><a href="{{ url_for('cart') }}" class="active">Cart <span id="cart-count">(0)</span></a></li>
                <li><a href="{{ url_for('orders') }}">My Orders</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
                <li id="admin-nav-item"><a href="{{ url_for('admin') }}">Admin</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1>Your Shopping Cart</h1>
        <div id="cart-items"></div>
        <div class="cart-summary">
            <h2>Cart Summary</h2>
            <div class="bill-details">
                <h3>Bill Summary</h3>
                <div class="bill-row">
                    <span>Subtotal</span>
                    <span>₹<span id="subtotal-price">0</span></span>
                </div>
                <div class="bill-row">
                    <span>GST (18%)</span>
                    <span>₹<span id="tax-amount">0</span></span>
                </div>
                <div class="bill-row total-row">
                    <span>Total</span>
                    <span>₹<span id="total-price">0</span></span>
                </div>
            </div>
            <div class="cart-actions">
                <button id="print-bill-button" class="btn btn-secondary">Print Bill</button>
                <button id="checkout-button" class="btn btn-primary">Proceed to Checkout</button>
            </div>
        </div>

        <div id="checkout-modal" class="checkout-modal">
            <div class="checkout-modal-content">
                <h2>Checkout Details</h2>
                <form id="checkout-form">
                    <div class="form-row">
                        <label for="customer-name">Full Name</label>
                        <input type="text" id="customer-name" required placeholder="John Doe">
                    </div>
                    <div class="form-row">
                        <label for="customer-email">Email</label>
                        <input type="email" id="customer-email" required placeholder="john@example.com">
                    </div>
                    <div class="form-row">
                        <label for="customer-phone">Phone</label>
                        <input type="tel" id="customer-phone" required placeholder="+91 98765 43210">
                    </div>
                    <div class="form-row">
                        <label for="customer-address">Delivery Address</label>
                        <textarea id="customer-address" required placeholder="Street, City, Postal Code"></textarea>
                    </div>
                    <div class="checkout-actions">
                        <button type="button" id="checkout-cancel" class="btn btn-secondary">Cancel</button>
                        <button type="submit" class="btn btn-primary">Place Order</button>
                    </div>
                    <div id="checkout-error" class="error-message" aria-live="assertive"></div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Maitri Gift Shop. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/store.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
</body>
</html>
